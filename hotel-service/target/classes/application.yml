server:
  port: 8081 # Порт 8080 обычно занят, возьмем следующий

spring:
  application:
    name: hotel-service # Имя для Eureka
  datasource:
    url: jdbc:h2:mem:hoteldb # База в памяти
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update # Автоматически создаст таблицы
    show-sql: true # Будем видеть SQL запросы в консоли (удобно для отладки)
  h2:
    console:
      enabled: true # Доступ к консоли БД по /h2-console
      path: /h2-console

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
